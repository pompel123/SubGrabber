name: 'Build RogueMaster FAP'
on:
  push:
  pull_request:

jobs:
  build-fap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Flipper App (.fap)
        uses: flipperdevices/fbt-action@v1
        with:
          # Point to RogueMaster's dev branch or a specific tag
          sdk-channel: custom
          sdk-url: https://github.com
